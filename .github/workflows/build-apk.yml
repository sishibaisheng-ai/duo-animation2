name: Try Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew (if exists)
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Try Gradle Build
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "未发现标准 gradlew 文件，尝试寻找子目录或自动检索构建指令..."
          find . -maxdepth 3 -name "gradlew" -exec chmod +x {} \; -exec {} assembleDebug \;
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/*.apk
